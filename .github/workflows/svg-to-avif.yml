name: Convert SVGs to AVIF

on:  
  workflow_dispatch:
  push:
    paths:
      - "sprite/**/*.svg"

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y imagemagick libheif-examples libheif-dev

      - name: Convert SVGs to AVIF
        run: |
          mkdir -p converted
          for file in sprite/*.svg; do
            name=$(basename "$file" .svg)
            echo "Converting $file..."
            magick "$file" -density 3840x3840 -quality 90 "converted/${name}.avif"
          done

      - name: Commit converted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add converted/*.avif
          git commit -m "Add converted AVIF emojis" || echo "No changes to commit"
          git push
